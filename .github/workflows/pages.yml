name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Least privilege needed for deploy-pages to mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true   # bundle install + cache, keyed on Gemfile.lock

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # base_path is empty for a user site on a custom domain; passing it anyway
      # keeps the workflow correct if the repo is ever moved to a project site.
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # CNAME has no front matter, so Jekyll copies it into _site verbatim.
      # The custom domain depends on it surviving into the artifact.
      - name: Verify CNAME survived the build
        run: |
          test -f _site/CNAME || { echo "::error::CNAME missing from _site"; exit 1; }
          echo "CNAME -> $(cat _site/CNAME)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
