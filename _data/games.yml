# Games I PLAY, not games I've built. One flat list.
#
# ---------------------------------------------------------------------------
# ADDING A GAME
# ---------------------------------------------------------------------------
# Only `title` is required. Add `year` or `igdb_id` (ideally both) so the game
# lands in a year section.
#
#   - title: Game Name
#     year: 2026                 # Year YOU played it. Omit if you don't remember:
#                                #   the IGDB release year is used instead.
#     status: playing            # playing | finished | dropped | replayed
#                                #   omit, or use `finished`, for no badge
#     cover: /assets/img/games/game-name.jpg    # optional override, see below
#     rating: 4                  # 1-5
#     platform: PC               # or a list, played on both at once: [PC, Switch]
#     all_time: true             # ALSO shows in the All-Time section at the bottom
#     note: "one line"
#     url: "https://..."         # makes the whole card a link
#     igdb_id: 1234              # which IGDB game this is: release year + cover
#                                #   (the number, not the URL slug). The script
#                                #   prints candidates for entries without one.
#
# ---------------------------------------------------------------------------
# BOX ART
# ---------------------------------------------------------------------------
# Normally: set `igdb_id` and run script/fetch-covers.rb. It saves the cover as
# assets/img/games/<igdb-slug>.jpg and the release year to _data/igdb.yml
# (generated, commit it). The page finds both on its own, no `cover` key.
#
# Override, for games not on IGDB or art you picked yourself:
# 1. Drop the file in  assets/img/games/
# 2. Point `cover` at it with a leading slash: /assets/img/games/riftbound.png
# A game with `cover` is never looked up or overwritten, even with --force.
#
# Cards are 3:4 (box art proportions) and images are object-fit: cover, so any
# aspect ratio works but 3:4 crops best. ~600x800 is plenty even for retina.
#
# DO NOT start a filename with an underscore. Jekyll treats every _-prefixed file
# and folder as private and silently leaves it out of the build: the <img> tag
# renders fine and the image 404s, with nothing in the build log to explain it.
# Covers are OPTIONAL: an entry without one renders the title's initial set
# large in mono, at the same size, so the grid never has holes.
#
# ---------------------------------------------------------------------------
# ALL-TIME
# ---------------------------------------------------------------------------
# Add `all_time: true` to any entry. The section appears at the bottom of the
# page automatically once at least one game is flagged, and hides itself when
# none are. An all-time pick still sits in a year section: use the year you
# FIRST played it (or omit it for the release year), which makes the year log
# double as a history.
#
# A game appearing in Now Playing, its year section, AND All-Time is intended.
# The year log is the complete record; the other two are curated rails.
#
# ---------------------------------------------------------------------------
# PLAYED IT MORE THAN ONCE
# ---------------------------------------------------------------------------
# Same time, several platforms: one entry, `platform` as a list.
#
#   - title: Hades
#     platform: [PC, Switch]
#     year: 2020
#
# Different times: a `plays:` list. Each play gets its own card and can set its
# own year, platform, igdb_id (the cover follows it), status and all_time. Keys
# on the parent (note, url, rating...) apply to every play unless a play
# overrides them.
#
#   - title: Chrono Trigger
#     plays:
#       - platform: SNES
#         igdb_id: 1802
#       - platform: DS
#         year: 2022
#         igdb_id: 20398
#         all_time: true
#
# Two plays with the same title, platform AND year fail the build.

